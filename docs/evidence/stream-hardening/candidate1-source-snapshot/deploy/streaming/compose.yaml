# Opt-in overlay: docker compose -f deploy/local/compose.yaml -f deploy/streaming/compose.yaml up
# Official Apache Kafka 4.1.1 linux/amd64 digest, pulled 2026-09-29;
# source: https://hub.docker.com/r/apache/kafka/tags and local image RepoDigests.
services:
  ingest:
    profiles: [direct]
  kafka:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_MESSAGE_MAX_BYTES: "5242880"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "5242880"
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [telemetry]
  kafka-topic:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        topic=incidentlens-spans-v1
        bin=/opt/kafka/bin/kafka-topics.sh
        if ! "$$bin" --bootstrap-server kafka:9092 --describe --topic "$$topic" >/dev/null 2>&1; then
          "$$bin" --bootstrap-server kafka:9092 --create --topic "$$topic" --partitions 1 --replication-factor 1 \
            --config retention.ms=3600000 --config retention.bytes=1073741824 --config segment.bytes=67108864 --config segment.ms=300000 --config max.message.bytes=5242880
        fi
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --entity-type topics --entity-name "$$topic" --alter \
          --add-config retention.ms=3600000,retention.bytes=1073741824,segment.bytes=67108864,segment.ms=300000,max.message.bytes=5242880
        "$$bin" --bootstrap-server kafka:9092 --describe --topic "$$topic"
    depends_on:
      kafka: {condition: service_healthy}
    networks: [telemetry]
  stream-ingest:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: stream-ingest
    environment:
      STREAM_GRPC_ADDRESS: 0.0.0.0:4318
      STREAM_HEALTH_ADDRESS: 0.0.0.0:8082
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: incidentlens-spans-v1
    ports:
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18082:8082"
    depends_on:
      kafka-topic: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1
    networks: [telemetry]
  stream-worker:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: stream-worker
    environment:
      STREAM_HEALTH_ADDRESS: 0.0.0.0:8083
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: incidentlens-spans-v1
      KAFKA_GROUP_ID: incidentlens-stream-worker-v1
      CLICKHOUSE_ADDRESS: clickhouse:9000
      CLICKHOUSE_USER: ingest
      CLICKHOUSE_PASSWORD: local-ingest
    ports:
      - "127.0.0.1:18083:8083"
    depends_on:
      kafka-topic: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1
    networks: [telemetry]
  collector:
    volumes: !override
      - ../streaming/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: !override
      stream-ingest: {condition: service_started}
volumes:
  kafka-data:
